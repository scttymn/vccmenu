<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Edit menu · Valley Coffee Co</title><link rel="stylesheet" href="/menu-assets/editor.css"><script src="/menu-assets/editor.js" defer></script></head>
<body><main class="editor"><header class="masthead"><a class="wordmark" href="/admin">VALLEY COFFEE CO<span>THE MENU BOOK</span></a><form action="/logout" method="post"><button class="text-button" type="submit">Sign out</button></form></header><div class="intro"><p class="eyebrow">A LITTLE UPDATE, FRESHLY SERVED</p><h1>Make it yours.</h1><p>Change a price, add something good, or tuck an item away for later.</p></div><div class="toolbar"><span id="summary">Loading your menu…</span><a href="/" target="_blank" rel="noopener">View TV menu ↗</a></div><form id="menu-form" hidden><details class="settings"><summary>Shop name &amp; menu title</summary><div class="settings-fields"><label>Shop name<input id="brand" maxlength="60" required></label><label>Menu title<input id="title" maxlength="30" required></label></div></details><div id="sections"></div><div class="save-bar"><div><strong id="save-label">Everything is up to date</strong><p id="status" role="status" aria-live="polite">Changes reach the TV within 30 seconds of saving.</p></div><button id="save" type="submit" disabled>Save menu</button></div></form><p id="error" class="error" role="alert" hidden></p><button id="retry" class="secondary" type="button" hidden>Try loading again</button></main>
<template id="section-template"><details class="section-card"><summary><span class="section-number"></span><h2></h2><span class="item-count"></span><span class="chevron">⌄</span></summary><div class="section-content"><label class="section-name">Section name<input data-section="name" maxlength="30" required></label><div class="item-list"></div><button class="add secondary" type="button">+ Add an item</button><details class="section-settings"><summary>Notes &amp; toppings</summary><div class="settings-fields"><label>Note above the items<input data-section="note" maxlength="120"></label><label>Note below the items<input data-section="footer" maxlength="120"></label><label>Toppings or extras <span class="hint">One per line</span><textarea data-section="extras" rows="4"></textarea></label></div></details></div></details></template>
<template id="item-template"><div class="item-editor"><div class="item-fields"><label>Item name<input data-field="name" maxlength="80" required></label><label>Price <input data-field="price" maxlength="40" required placeholder="$4 / $4.50 / $5"></label></div><div class="item-actions"><label class="visibility"><input type="checkbox" data-field="visible"><span>On the menu</span></label><div class="row-buttons"><button type="button" class="move-up" aria-label="Move item up">↑</button><button type="button" class="move-down" aria-label="Move item down">↓</button><button type="button" class="remove">Remove</button></div></div></div></template>
</body></html>
